<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ news.title }}</title>
</head>
<body>
    <h1>{{ news.title }}</h1>
    <p><strong>Автор:</strong> {{ news.author.username }}</p>
    <p><strong>Дата публикации:</strong> {{ news.pub_date|date:"d.m.Y H:i" }}</p>
    <p><strong>Краткое описание:</strong> {{ news.short_description }}</p>
    <hr>
    <div>
        {{ news.text|linebreaks }}
    </div>
</body>
</html>
